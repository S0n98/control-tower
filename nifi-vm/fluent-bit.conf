# Fluent Bit systemd service config for the NiFi VM.
# Install: https://docs.fluentbit.io/manual/installation/linux
# Config path: /etc/fluent-bit/fluent-bit.conf (classic format shown; adapt if using YAML config on newer Fluent Bit)

[SERVICE]
    Flush         5
    Log_Level     info

[INPUT]
    Name          tail
    Path          /opt/nifi/nifi-current/logs/nifi-app.log
    Tag           nifi.app
    Path_Key      log_path
    Refresh_Interval 10

[INPUT]
    Name          tail
    Path          /opt/nifi/nifi-current/logs/nifi-bootstrap.log
    Tag           nifi.bootstrap
    Path_Key      log_path
    Refresh_Interval 10

[OUTPUT]
    Name          loki
    Match         nifi.*
    Host          loki.monitoring.example.internal   # fill in: reachable Loki push endpoint
    Port          443
    tls           On
    # Confirm auth mechanism fronting Loki's push API (see plan "Open items") —
    # add http_user/http_passwd or a bearer token here once known.
    Labels        job=nifi, system=nifi, instance=nifi-vm-01
    Label_keys    $tag
