# Live values (helm get values loki -n monitoring), chart loki-7.3.0.
# chunksCache/resultsCache disabled deliberately - their defaults tried to
# allocate ~10GB combined, which starved the rest of this single node.
backend:
  replicas: 0
chunksCache:
  enabled: false
deploymentMode: SingleBinary
gateway:
  enabled: false
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    retention_period: 336h
  schemaConfig:
    configs:
    - from: "2024-01-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
monitoring:
  lokiCanary:
    enabled: false
  selfMonitoring:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
read:
  replicas: 0
resultsCache:
  enabled: false
singleBinary:
  persistence:
    enabled: true
    size: 20Gi
    storageClass: nfs-client
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
test:
  enabled: false
write:
  replicas: 0
