# Live values (helm get values fluent-bit -n monitoring), chart fluent-bit-0.57.9.
# HTTP_Server/HTTP_Listen/HTTP_Port/Health_Check in [SERVICE] are required -
# omitting them fails the chart's default readiness probe (CLAUDE.md).
config:
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
  outputs: |
    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        loki.monitoring.svc.cluster.local
        Port        3100
        Labels      job=fluentbit
        Label_keys  $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['labels']['app'],$kubernetes['labels']['spark-role'],$kubernetes['labels']['component']
        Auto_Kubernetes_Labels Off
  service: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On
resources:
  requests:
    cpu: 50m
    memory: 64Mi
tolerations:
- operator: Exists
